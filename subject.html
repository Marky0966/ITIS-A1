<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="logo.svg"><link rel="stylesheet" href="style.css"><title> Subject · G11 STEM ITIS A1</title></head><body><main></main><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="app.js"></script><script>boot('subjects.html',m=>{
const s=SUBJECTS[+new URLSearchParams(location.search).get('i')]||SUBJECTS[0];
m.innerHTML=`<a href="subjects.html">← All subjects</a><div class="hero" style="border-color:${s.c}"><h1>${s.i} ${esc(s.n)}</h1><p>Lessons organized by term.</p></div><div class="cols" id="cols"></div>
<div class="card" style="margin-top:20px"><h3>➕ Add a lesson or note</h3><p style="color:var(--mute)">${isOwner()?'You are the owner: your posts go live immediately.':'Your post will appear after the owner approves it.'}</p>
<select id="t">${TERMS.map(x=>`<option>${x}</option>`).join('')}</select><input id="ti" placeholder="Title"><textarea id="tx" rows="4" placeholder="Notes / lesson"></textarea><input id="lk" placeholder="Link (optional)"><input type="file" id="im" accept="image/*"><button onclick="add()">Submit</button></div>`;
S.watch('lessons',L=>{L=L.filter(l=>l.ok&&l.s==s.n);cols.innerHTML=TERMS.map(t=>`<div class="col"><h3>${t}</h3>${L.filter(l=>l.t==t).map(lessonCard).join('')||'<div class="alert">Nothing here yet.</div>'}</div>`).join('')});
window.add=()=>{if(!ti.value.trim())return alert('Please add a title.');const f=im.files[0];
const save=d=>{S.add('lessons',{s:s.n,t:t.value,ti:ti.value,tx:tx.value,link:lk.value,im:d,by:me().name,ok:isOwner()}).then(()=>{alert(isOwner()?'Posted!':'Submitted! Waiting for owner approval.');ti.value=tx.value=lk.value=im.value=''})};
if(f){if(f.size>300000)return alert('Image too large (max 300 KB).');const r=new FileReader();r.onload=()=>save(r.result);r.readAsDataURL(f)}else save('')}})</script></body></html>
